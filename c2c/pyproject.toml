[project]
name = "c2c"
version = "0.1.0"
description = "MCP server enabling Claude Code to create and manage other Claude Code sessions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "codex-scratchpad contributors" }
]
keywords = ["mcp", "claude-code", "agent", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.3.5",
    "pydantic>=2.11.9",
    "asyncio>=3.4.3",
    "nest-asyncio>=1.6.0",
]

[project.urls]
Repository = "https://github.com/lucharo/codex-scratchpad"
Issues = "https://github.com/lucharo/codex-scratchpad/issues"

[project.scripts]
c2c = "c2c.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
